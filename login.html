<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login - rakDEV Studio</title>
  <meta name="description" content="Masuk ke akun rakDEV Studio Anda.">
  <link rel="icon" href="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/login.css">
  <link rel="stylesheet" href="/shared/skeleton.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="/dashboard" class="brand-link" title="Kembali ke Dashboard">
          <img src="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png" alt="rakDEV Logo" class="brand-logo">
        </a>
        <h1 class="auth-title">Masuk ke rakDEV</h1>
        <p class="auth-subtitle">Kelola endorser, unduh resources, dan akses fitur studio.</p>
      </div>

      <div class="auth-alert" id="authAlert" hidden></div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="nama@email.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="loginPassword" class="form-label">Password</label>
          </div>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="btn-toggle-pw" id="btnTogglePassword" aria-label="Lihat password">
              <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnLoginSubmit">
          <span id="btnSubmitText">Masuk Sekarang</span>
        </button>
      </form>

      <div class="auth-footer">
        <span>Belum punya akun? <a href="/register.html" class="auth-link">Daftar sekarang</a></span>
      </div>
    </div>
  </div>

  <script type="module" src="/login.js"></script>
</body>
</html>
