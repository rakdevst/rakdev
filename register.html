<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){try{var s=sessionStorage.getItem('clean_url');if(s){sessionStorage.removeItem('clean_url');window.history.replaceState(null,'',s);return;}var p=window.location.pathname;if(/\.(html?|htm)$/i.test(p)||p.endsWith('/')||p===''||p.endsWith('/index')){var c=p.replace(/\.(html?|htm)$/i,'');if(c.endsWith('/index')||c===''||c==='/'){c=c.replace(/\/?index$/,'')+'/dashboard';}else{c=c.toLowerCase();}var f=(c.startsWith('/')?c:'/'+c)+window.location.search+window.location.hash;window.history.replaceState(null,'',f);}}catch(e){}})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Portal Utama</title>
  <link rel="icon" href="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="login-container">
    <div class="panda-wrapper" id="pandaContainer">
      <div class="panda">
        <div class="panda-ear left"></div>
        <div class="panda-ear right"></div>
        <div class="panda-head" id="pandaHead">
          <div class="panda-eye-patch left">
            <div class="panda-eyeball" id="eyeLeft"><div class="panda-pupil"></div></div>
          </div>
          <div class="panda-eye-patch right">
            <div class="panda-eyeball" id="eyeRight"><div class="panda-pupil"></div></div>
          </div>
          <div class="panda-blush left"></div>
          <div class="panda-blush right"></div>
          <div class="panda-nose"></div>
          <div class="panda-mouth"></div>
        </div>
        <div class="panda-paw left"></div>
        <div class="panda-paw right"></div>
      </div>
    </div>

    <main class="card" id="formCard">
      <div class="card-header">
        <h1>Buat Akun</h1>
        <p>Lengkapi data di bawah untuk mendaftar</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@gmail.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="contoh. Ab21._C" autocomplete="new-password" required>
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle Password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field-hint">Minimal 6 karakter dengan huruf besar, huruf kecil, angka, titik (.) dan garis bawah (_).</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi Password" autocomplete="new-password" required>
            <button type="button" id="toggleConfirmPassword" class="password-toggle" aria-label="Toggle Confirm Password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnRegister" class="btn-submit">
          <span id="btnText">DAFTAR AKUN</span>
        </button>

        <div class="auth-switch">
          Sudah punya akun? <a href="login.html" class="auth-link">Login</a>
        </div>
      </form>
    </main>
  </div>

  <script type="module" src="/register.js"></script>
</body>
</html>
