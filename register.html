<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Daftar Akun - rakDEV Studio</title>
  <meta name="description" content="Buat akun rakDEV Studio baru.">
  <link rel="icon" href="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/register.css">
  <link rel="stylesheet" href="/shared/skeleton.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <a href="/dashboard" class="brand-link" title="Kembali ke Dashboard">
          <img src="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png" alt="rakDEV Logo" class="brand-logo">
        </a>
        <h1 class="auth-title">Daftar Akun Baru</h1>
        <p class="auth-subtitle">Bergabung dengan rakDEV Studio untuk memesan endorse & resources.</p>
      </div>

      <div class="auth-alert" id="authAlert" hidden></div>
      <div class="auth-success" id="authSuccess" hidden></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="regFullName" class="form-label">Nama Lengkap</label>
          <input type="text" id="regFullName" class="form-control" placeholder="Contoh: Raka Aditya" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="nama@email.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Password (Minimal 6 karakter)</label>
          <div class="password-wrapper">
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
            <button type="button" class="btn-toggle-pw" id="btnTogglePassword" aria-label="Lihat password">
              <svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnRegisterSubmit">
          <span id="btnSubmitText">Buat Akun</span>
        </button>
      </form>

      <div class="auth-footer">
        <span>Sudah punya akun? <a href="/login.html" class="auth-link">Masuk di sini</a></span>
      </div>
    </div>
  </div>

  <script type="module" src="/register.js"></script>
</body>
</html>
