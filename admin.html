<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script>
    (function(){try{var s=sessionStorage.getItem('clean_url');if(s){sessionStorage.removeItem('clean_url');window.history.replaceState(null,'',s);return;}var p=window.location.pathname;if(/admin/i.test(p)){window.history.replaceState(null,'','/admin'+window.location.search+window.location.hash);return;}if(/\.(html?|htm)$/i.test(p)||p.endsWith('/')||p===''||p.endsWith('/index')){var c=p.replace(/\.(html?|htm)$/i,'');if(c.endsWith('/index')||c===''||c==='/'){c=c.replace(/\/?index$/,'')+'/dashboard';}else{c=c.toLowerCase();}var f=(c.startsWith('/')?c:'/'+c)+window.location.search+window.location.hash;window.history.replaceState(null,'',f);}}catch(e){}})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin Panel - rakDEV Studio</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>

  <!-- Gate / Checking Admin Status -->
  <div class="gate" id="gate">
    <div class="gate-spinner"></div>
    <p class="gate-text" id="gateText">memeriksa hak akses admin...</p>
    <button type="button" class="gate-retry" id="gateRetry">Muat ulang</button>
  </div>

  <!-- Login Required View -->
  <div class="auth-wrap" id="loginView" hidden>
    <div class="auth-card">
      <div class="brand-center">
        <img src="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png" alt="rakDEV" class="brand-img">
        <h1>rakDEV Admin</h1>
        <p>Masuk menggunakan akun admin Anda.</p>
      </div>
      <div class="alert" id="loginAlert" hidden></div>
      <form id="fmLogin">
        <div class="form-group">
          <label>Email Admin</label>
          <input class="form-control" type="email" id="inEmail" placeholder="admin@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" id="inPass" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn primary full" id="btnLogin">Masuk ke Panel</button>
      </form>
      <div style="text-align:center;margin-top:1.25rem">
        <a href="/dashboard" style="font-size:0.8125rem;color:var(--text-muted);text-decoration:none">&larr; Kembali ke Dashboard Studio</a>
      </div>
    </div>
  </div>

  <!-- Access Denied View -->
  <div class="auth-wrap" id="deniedView" hidden>
    <div class="auth-card">
      <div class="brand-center">
        <img src="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png" alt="rakDEV" class="brand-img">
        <h1 style="color:#dc2626">Akses Ditolak</h1>
        <p>Akun Anda (<span id="deniedEmail">-</span>) tidak memiliki izin sebagai Administrator rakDEV Studio.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a href="/dashboard" class="btn primary full" style="text-decoration:none;text-align:center">Kembali ke Dashboard</a>
        <button type="button" class="btn full" id="btnDeniedLogout">Ganti Akun</button>
      </div>
    </div>
  </div>

  <!-- Admin Panel Layout -->
  <div id="panelView" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="https://i.ibb.co.com/M5hFGd0t/file-00000000f1fc82308aa606d6a1e12263.png" alt="rakDEV">
        <div>rakDEV<span>Admin Panel</span></div>
      </div>
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="endorser">Endorser Slots</button>
      <button class="nav-btn" data-view="bookings">Booking & Pesanan</button>
      <button class="nav-btn" data-view="resources">Resources</button>
      <button class="nav-btn" data-view="tutorials">Tutorial</button>
      <button class="nav-btn" data-view="database">Database Status</button>
      
      <div class="nav-spacer"></div>
      <button class="nav-btn" id="btnLogout">Logout</button>
      <div class="who">
        <b id="whoName">-</b>
        <span id="whoEmail">-</span>
        <br><span class="chip">ADMINISTRATOR</span>
      </div>
    </aside>

    <div class="panel-body">
      <div class="topbar">
        <b>rakDEV Studio Control Center</b>
        <div class="topbar-actions">
          <a href="/dashboard" class="btn sm" target="_blank">Lihat Website &rarr;</a>
          <button class="btn sm" id="btnMenu">Menu</button>
        </div>
      </div>

      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
